    // --- DISPLAY FORMATTERS (Strictly No Calculation in Frontend) ---
    function formatRupees(value) {
      if (value === null || value === undefined || isNaN(value)) return "—";
      const isNegative = value < 0;
      const absValue = Math.abs(Math.round(value));
      const str = absValue.toString();
      let result = "";
      if (str.length > 3) {
        const lastThree = str.substring(str.length - 3);
        const otherNumbers = str.substring(0, str.length - 3);
        result = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + lastThree;
      } else {
        result = str;
      }
      return (isNegative ? "-₹" : "₹") + result;
    }

    function formatPercent(value, decimals = 0) {
      if (value === null || value === undefined || isNaN(value)) return "—";
      const pct = (Number(value) * 100).toFixed(decimals);
      return `${pct}%`;
    }

    function formatNumber(value) {
      if (value === null || value === undefined || isNaN(value)) return "—";
      return new Intl.NumberFormat("en-IN").format(value);
    }

    function formatMetric(value, unit = "") {
      if (value === null || value === undefined || value === "") return "—";
      return unit ? `${value} ${unit}` : `${value}`;
    }

                  {mismatch_metrics?.mismatch_pattern_summary || "Many customers self-report aggressive risk tolerance, but historical trade reactions show capital preservation behavior."}
                </p>
                <div className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-xs text-amber-300">
                  💡 <strong>Advisor Note:</strong> This divergence is extremely common in young professionals before experiencing their first major drawdown.
                </div>
              </div>
            </div>

            {/* Right 5 Cols: Benchmarks */}
            <div className="lg:col-span-5 space-y-6">
              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-lg space-y-6">
                <div className="border-b border-slate-800 pb-3">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Customer Relative Standing</span>
                  <h2 className="text-lg font-bold text-white mt-0.5">Where You Sit vs Peer Group</h2>
                </div>

                <div className="space-y-2">
                  <div className="flex items-center justify-between text-xs">
                    <span className="font-semibold text-slate-200">Monthly Savings Surplus</span>
                    <span className="font-mono font-bold text-emerald-400">
                      {formatPercent(customer_benchmarks?.savings_rate_percentile, 0)} Percentile
                    </span>
                  </div>
                  <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div
                      className="bg-emerald-500 h-full rounded-full transition-all duration-500"
                      style={{ width: `${(customer_benchmarks?.savings_rate_percentile || 0.74) * 100}%` }}
                    />
                  </div>
                  <p className="text-[11px] text-slate-400 italic">
                    {customer_benchmarks?.surplus_rank_summary || "Higher savings surplus than 74% of peers"}
                  </p>
                </div>

                <div className="space-y-2">
                  <div className="flex items-center justify-between text-xs">
                    <span className="font-semibold text-slate-200">Expense Stability / Discipline</span>
                    <span className="font-mono font-bold text-indigo-400">
                      {formatPercent(customer_benchmarks?.expense_discipline_percentile, 0)} Percentile
                    </span>
                  </div>
                  <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div
                      className="bg-indigo-500 h-full rounded-full transition-all duration-500"
                      style={{ width: `${(customer_benchmarks?.expense_discipline_percentile || 0.62) * 100}%` }}
                    />
                  </div>
                  <p className="text-[11px] text-slate-400 italic">
                    Monthly spending predictability is higher than 62% of the peer cohort.
                  </p>
                </div>

                <div className="space-y-2">
                  <div className="flex items-center justify-between text-xs">
                    <span className="font-semibold text-slate-200">Emergency Fund Runway</span>
                    <span className="font-mono font-bold text-amber-400">
                      {formatPercent(customer_benchmarks?.emergency_buffer_percentile, 0)} Percentile
                    </span>
                  </div>
                  <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div
                      className="bg-amber-500 h-full rounded-full transition-all duration-500"
                      style={{ width: `${(customer_benchmarks?.emergency_buffer_percentile || 0.18) * 100}%` }}
                    />
                  </div>
                  <p className="text-[11px] text-slate-400 italic">
                    Lower emergency buffer than 82% of cohort — building liquid reserves is recommended.
                  </p>
                </div>

                <div className="pt-4 border-t border-slate-800 space-y-3">
                  <button
                    onClick={onNavigateToPlans}
                    className="w-full py-3.5 px-4 bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-bold text-sm rounded-xl transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 group cursor-pointer"
                  >
                    <span>Proceed to Goal Recommendations</span>
                    <svg className="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                  </button>

                  <button
                    onClick={onNavigateToRiskInsight}
                    className="w-full py-2.5 px-4 bg-slate-950 hover:bg-slate-800 active:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-800 transition-all cursor-pointer"
                  >
                    ← Return to Risk Insight
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP DEMO HARNESS ---
    function App() {
      const [activeScreen, setActiveScreen] = useState('3.6');
      const [selectedPersona, setSelectedPersona] = useState('C001');
      const [simulatedState, setSimulatedState] = useState('success');
      const [mismatchOverride, setMismatchOverride] = useState(null);

      let currentApiData = null;
      if (simulatedState === 'success') {
        if (selectedPersona === 'C001') {
          currentApiData = JSON.parse(JSON.stringify(MOCK_DATA_MISMATCH_C001));
        } else if (selectedPersona === 'C002') {
          currentApiData = JSON.parse(JSON.stringify(MOCK_DATA_ALIGNED_C002));
        } else if (selectedPersona === 'NULLS') {
          currentApiData = {
            customer_name: "Null Field Test Persona",
            profile: { net_worth: null, monthly_income: null, monthly_expense: null, monthly_surplus: null, emergency_fund_months: null },
            risk: {
              stated: null,
              revealed: null,
              confidence: null,
              mismatch: true,
              risk_capacity: null,
              features_used: { panic_sell_count: null, avg_days_to_exit_after_drop: null, expense_volatility: null, emergency_fund_months: null, equity_allocation_pct: null, budget_overshoot_rate: null },
              evidence: ["Null/Edge case test: missing fields render strictly as '—' rather than 0 or empty string."],
              model_version: "rr-null-test",
            },
            peer_cohort: null,
          };
        }

        if (currentApiData && mismatchOverride !== null && currentApiData.risk) {
          currentApiData.risk.mismatch = mismatchOverride;
        }
      }

      const isLoading = simulatedState === 'loading';
      const isError = simulatedState === 'error' ? "Simulated API gateway timeout (504)" : null;

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-emerald-500 selection:text-slate-950">
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-emerald-400 flex items-center justify-center font-black text-slate-950 text-lg shadow-lg shadow-emerald-500/20">
                  ₹
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-base text-white tracking-tight">FinancePlanner</span>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      Varada's Screens
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400">Team Hackathon Demo · Branch: feature/features</p>
                </div>
              </div>

              <div className="flex items-center bg-slate-950 border border-slate-800 rounded-xl p-1 shadow-inner">
                <button
                  onClick={() => setActiveScreen('3.6')}
                  className={`px-3.5 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 cursor-pointer ${
                    activeScreen === '3.6'
                      ? 'bg-emerald-500 text-slate-950 shadow-md font-bold'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                  }`}
                >
                  <span>Screen 3.6: Risk Insight</span>
                  <span className={`text-[9px] px-1 py-0.2 rounded font-mono ${activeScreen === '3.6' ? 'bg-slate-950/20 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>
                    STAR
                  </span>
                </button>
                <button
                  onClick={() => setActiveScreen('3.7')}
                  className={`px-3.5 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 cursor-pointer ${
                    activeScreen === '3.7'
                      ? 'bg-emerald-500 text-slate-950 shadow-md font-bold'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                  }`}
                >
                  <span>Screen 3.7: Similar Profiles</span>
                  <span className={`text-[9px] px-1 py-0.2 rounded font-mono ${activeScreen === '3.7' ? 'bg-slate-950/20 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>
                    COHORT
                  </span>
                </button>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center gap-1.5 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1">
                  <span className="text-[10px] text-slate-400 uppercase font-semibold">Persona:</span>
                  <select
                    value={selectedPersona}
                    onChange={(e) => {
                      setSelectedPersona(e.target.value);
                      setMismatchOverride(null);
                      if (simulatedState === 'empty') setSimulatedState('success');
                    }}
                    className="bg-transparent text-xs text-slate-200 font-medium focus:outline-none cursor-pointer"
                  >
                    <option value="C001" className="bg-slate-900 text-slate-200">C001 (Rahul - Mismatch)</option>
                    <option value="C002" className="bg-slate-900 text-slate-200">C002 (Priya - Aligned)</option>
                    <option value="NULLS" className="bg-slate-900 text-slate-200">Nulls / Missing Fields Test</option>
                  </select>
                </div>

                <div className="flex items-center gap-1.5 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1">
                  <span className="text-[10px] text-slate-400 uppercase font-semibold">State:</span>
                  <select
                    value={simulatedState}
                    onChange={(e) => setSimulatedState(e.target.value)}
                    className="bg-transparent text-xs text-slate-200 font-medium focus:outline-none cursor-pointer"
                  >
                    <option value="success" className="bg-slate-900 text-slate-200">Normal (Success)</option>
                    <option value="loading" className="bg-slate-900 text-slate-200">Loading Skeleton</option>
                    <option value="error" className="bg-slate-900 text-slate-200">Error State</option>
                    <option value="empty" className="bg-slate-900 text-slate-200">Empty State</option>
                  </select>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 py-6 px-3 sm:px-6">
            {activeScreen === '3.6' ? (
              <RiskInsight
                apiData={currentApiData}
                isLoading={isLoading}
                error={isError}
                onNavigateToPlans={() => alert("Navigating to Screen 4 (Personalized Plan Recommendations)...")}
                onNavigateToCohort={() => setActiveScreen('3.7')}
                onToggleMismatchOverride={(overrideVal) => setMismatchOverride(overrideVal)}
              />
            ) : (
              <SimilarProfiles
                cohortData={currentApiData}
                apiData={currentApiData}
                isLoading={isLoading}
                error={isError}
                onNavigateToRiskInsight={() => setActiveScreen('3.6')}
                onNavigateToPlans={() => alert("Navigating to Screen 4 (Personalized Plan Recommendations)...")}
              />
            )}
          </main>

          <footer className="border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-400">
            Finance-Planner Hackathon UI · Single-file React Components · Pure Display Formatting (Zero Calculations in Frontend)
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
